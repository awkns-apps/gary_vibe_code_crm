        owner:
          type: string
        tags:
          type: array
          items:
            type: string
        summary:
          type: string
        notes:
          type: string
        nextAction:
          type: string
        nextActionAt:
          type: string
          format: date-time
    ContactPatch:
      type: object
      properties:
        name:
          type: string
        title:
          type: string
        department:
          type: string
        email:
          type: string
        phone:
          type: string
        linkedinUrl:
          type: string
        isPrimary:
          type: boolean
        notes:
          type: string
    DealPatch:
      type: object
      properties:
        clientId:
          type: integer
        title:
          type: string
        stage:
          type: string
